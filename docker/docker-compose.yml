# 
# docker-compose.yml — определяет сервисы для разработки и тестирования.
services:
  postgres:
    container_name: postgres-container
    image: postgres:12.20
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=intern
      - POSTGRES_PASSWORD=${PASSWORD}
      - POSTGRES_DB=card_db
      - POSTGRES_SCHEMA=custom
    expose:
      - 5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U intern -d card_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    network_mode: docker_default
    restart: unless-stopped

  app:
    container_name: cards-microservice
    image: cards-microservice
    build:
      context: ..
      args:
        - SPRING_VERSION=${SPRING_VERSION}
    environment:
      - APP_PORT=8081
      - POSTGRES_DATASOURCE_URL=jdbc:postgresql://postgres-container:5432/card_db
      - KEYSTORE_PASSWORD=${PASSWORD}
      - DATA_KEYSTORE_PATH=file:/etc/secrets/data-secret.p12
      - JWT_KEYSTORE_PATH=file:/etc/secrets/jwt-secret.p12
    ports:
      - "8081:8081"
    expose:
      - 8081
    volumes:
      - ./data-secret.p12:/etc/secrets/data-secret.p12:ro
      - ./jwt-secret.p12:/etc/secrets/jwt-secret.p12:ro
    depends_on:
      postgres:
        condition: service_healthy
    network_mode: docker_default

networks:
  default:
    name: docker_default
    external: true
